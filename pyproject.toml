# TradingAgents monorepo — uv workspace root.
#
# This is a virtual workspace root: it has no [project] table, so `uv` unifies
# the dependencies of every member under packages/ into a single lockfile
# (uv.lock) and environment (.venv). Add new projects under packages/<name>/.
[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages/tradingagents/tests", "packages/tradingpaperaccount/tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
    "slow: longer-running tests (model fitting)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
