[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingpaperaccount"
version = "0.1.0"
description = "TradingPaperAccount"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
]
